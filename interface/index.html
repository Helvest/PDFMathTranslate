<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traduction PDF</title>
<style>
  :root {
    --fond: var(--background, #1a1a1a);
    --carte: var(--card, #222);
    --bord: var(--border, #333);
    --texte: var(--foreground, #e8e8e8);
    --faible: var(--muted-foreground, #888);
    --accent: var(--accent, #6ea8fe);
    --ok: #4ade80;
    --attention: #fbbf24;
    --erreur: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fond);
    color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------------- barre haute : titre + etapes ---------------- */
  .haut {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--bord);
    background: var(--carte);
    flex: 0 0 auto;
  }
  .marque { font-weight: 600; letter-spacing: -0.01em; }
  .marque small { color: var(--faible); font-weight: 400; margin-left: 6px; }

  .etapes { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .etape {
    flex: 1 1 0; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--bord);
    border-radius: 7px;
    background: transparent;
    padding: 5px 10px;
    text-align: left;
    position: relative;
    overflow: hidden;
    transition: border-color .15s;
  }
  .etape:hover:not(:disabled) { border-color: var(--accent); }
  .etape:disabled { cursor: not-allowed; opacity: .5; }
  .etape .ic { flex: 0 0 auto; color: var(--accent); }
  .etape .nom { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .etape .det { color: var(--faible); font-size: 11px; white-space: nowrap; }

  /* barre de progression en fond du bouton */
  .etape .barre {
    position: absolute; inset: 0 auto 0 0;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    width: 0; transition: width .3s;
    pointer-events: none;
  }
  .etape.en_cours { border-color: var(--accent); }
  .etape.en_cours .ic { animation: tourne 1.2s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .etape.termine .ic { color: var(--ok); }
  .etape.erreur { border-color: var(--erreur); }
  .etape.erreur .ic { color: var(--erreur); }
  .etape.bloque { opacity: .45; }
  .etape.pause { border-color: var(--attention); }
  .etape.pause .ic { color: var(--attention); }
  .etape.tout { flex: 0 0 auto; padding: 5px 14px; border-color: var(--accent); }

  .pilule {
    border: 1px solid var(--bord); border-radius: 5px;
    padding: 2px 8px; font-size: 11px; color: var(--faible);
    white-space: nowrap;
  }
  .pilule.ok { border-color: var(--ok); color: var(--ok); }
  .pilule.ko { border-color: var(--erreur); color: var(--erreur); }

  /* ---------------- corps ---------------- */
  .corps { flex: 1; display: flex; min-height: 0; }

  /* zone centrale */
  .centre { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .onglets {
    display: flex; gap: 2px; padding: 0 12px;
    border-bottom: 1px solid var(--bord);
    flex: 0 0 auto; overflow-x: auto;
  }
  .onglet {
    padding: 8px 12px; background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--faible); white-space: nowrap;
  }
  .onglet:hover { color: var(--texte); }
  .onglet.on { color: var(--texte); border-bottom-color: var(--accent); font-weight: 600; }
  .vue { flex: 1; overflow: auto; padding: 14px 16px; min-height: 0; }

  /* panneau projets (gauche, repliable) */
  .projets {
    flex: 0 0 210px;
    border-right: 1px solid var(--bord);
    background: var(--carte);
    display: flex; flex-direction: column;
    transition: flex-basis .18s;
    min-width: 0;
  }
  .projets.replie { flex-basis: 34px; }
  .projets.replie .ptete-texte,
  .projets.replie .pliste,
  .projets.replie .pied { display: none; }
  .ptete {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-bottom: 1px solid var(--bord);
  }
  .ptete-texte { flex: 1; font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em; color: var(--faible); }
  .bascule {
    background: none; border: 1px solid var(--bord); border-radius: 5px;
    width: 22px; height: 22px; display: flex; align-items: center;
    justify-content: center; color: var(--faible); flex: 0 0 auto;
  }
  .bascule:hover { color: var(--texte); border-color: var(--accent); }
  .pliste { flex: 1; overflow: auto; padding: 6px; }
  .pitem {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 9px; border-radius: 6px; margin-bottom: 2px;
    background: none; border: none; width: 100%; text-align: left;
  }
  .pitem:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .pitem.on { background: color-mix(in srgb, var(--accent) 22%, transparent); font-weight: 600; }
  .pitem .pt { width: 6px; height: 6px; border-radius: 50%; background: var(--faible); flex: 0 0 6px; }
  .pitem.on .pt { background: var(--accent); }
  .pitem .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .pc { font-size: 10.5px; color: var(--faible); }
  .pied { padding: 8px 10px; border-top: 1px solid var(--bord); }

  /* ---------------- elements communs ---------------- */
  .btn {
    background: none; border: 1px solid var(--bord); border-radius: 6px;
    padding: 5px 10px; color: var(--texte);
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.plein { width: 100%; text-align: center; }
  .btn.acc { border-color: var(--accent); color: var(--accent); }
  .btn.mini { padding: 2px 7px; font-size: 11px; }
  .btn.danger { border-color: var(--erreur); color: var(--erreur); }

  h2.titre {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--faible);
    margin: 0 0 7px 0;
  }
  .bloc { margin-bottom: 18px; }
  .vide { color: var(--faible); font-style: italic; }
  .faible { color: var(--faible); }
  .rangee { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

  textarea {
    width: 100%; background: transparent; border: 1px solid var(--bord);
    border-radius: 7px; padding: 9px 11px; resize: vertical;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    line-height: 1.5; min-height: 120px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  input[type=text], input[type=number], select {
    background: transparent; border: 1px solid var(--bord);
    border-radius: 6px; padding: 5px 9px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  select { background: var(--carte); }
  label.champ { display: block; margin-bottom: 10px; }
  label.champ > span { display: block; font-size: 11px; color: var(--faible); margin-bottom: 3px; }
  .case { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    text-align: left; font-weight: 600; color: var(--faible);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
    padding: 5px 8px; border-bottom: 1px solid var(--bord);
    white-space: nowrap;
  }
  th.tri { cursor: pointer; user-select: none; }
  th.tri:hover { color: var(--texte); }
  th .fl { opacity: .3; margin-left: 3px; font-size: 9px; }
  th.actif { color: var(--accent); }
  th.actif .fl { opacity: 1; }
  tr.groupe td {
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    font-weight: 600; font-size: 11px; padding: 7px 8px;
    border-top: 1px solid var(--bord);
  }
  .scroll-tab { max-height: 62vh; overflow: auto; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--bord); }
  tr:last-child td { border-bottom: none; }
  .faible { color: var(--faible); }

  .tag {
    display: inline-block; border: 1px solid var(--bord); border-radius: 4px;
    padding: 0 5px; font-size: 10.5px;
  }
  .tag.auto { border-color: var(--accent); color: var(--accent); }
  .tag.manuel { border-color: var(--texte); }
  .tag.defaut { color: var(--faible); border-style: dashed; }
  .tag.installe { border-color: var(--ok); color: var(--ok); }

  /* log */
  .log {
    border: 1px solid var(--bord); border-radius: 7px;
    padding: 9px 11px; font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; line-height: 1.5; white-space: pre-wrap;
    color: var(--faible); max-height: 260px; overflow: auto;
    background: color-mix(in srgb, var(--fond) 60%, transparent);
  }
  .log b { color: var(--texte); font-weight: 600; }

  .barre-prog {
    height: 4px; background: var(--bord); border-radius: 2px; overflow: hidden;
    margin: 8px 0 4px;
  }
  .barre-prog > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  .notif {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--carte); border: 1px solid var(--bord);
    border-radius: 7px; padding: 8px 14px; font-size: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); z-index: 50;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .notif.on { opacity: 1; }
  .notif.erreur { border-color: var(--erreur); color: var(--erreur); }

  .modal-fond {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; z-index: 60;
  }
  .modal {
    background: var(--carte); border: 1px solid var(--bord);
    border-radius: 10px; padding: 18px; width: 340px;
  }
  .modal h3 { margin: 0 0 12px; font-size: 14px; }
  .modal .rangee { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .cache { display: none !important; }
  .scroll { max-height: 340px; overflow: auto; }

  /* --- Banc : leviers et resultats --- */
  /* une pastille est une petite info chiffonnee : gratuit, effort, verdict */
  .pastille {
    display: inline-block; padding: 0 5px; margin-left: 4px;
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 9.5px; line-height: 15px; color: var(--muted-foreground);
    vertical-align: middle; white-space: nowrap;
  }
  .pastille.ok { border-color: var(--ok); color: var(--ok); }
  .pastille.warn { border-color: var(--warn, #d68910); color: var(--warn, #d68910); }
  .alerte { color: var(--warn, #d68910); }

  /* la fiche d'un modele : nom, contexte, efforts, parametres supportes */
  .fiche-modele {
    margin-top: 7px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--card, transparent);
    font-size: 11.5px; line-height: 1.75;
  }
  .fiche-modele > div > span.faible { display: inline-block; min-width: 128px; }
  /* le JSON brut du modele : lisible, selectable, jamais coupe */
  .brut-json {
    margin: 6px 0 0; padding: 8px 10px; max-height: 320px; overflow: auto;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--muted, rgba(127,127,127,.07));
    font-size: 10.5px; line-height: 1.5; white-space: pre-wrap;
    word-break: break-word; user-select: text;
  }
  /* --- Banc : le tableau croise et les notes --- */
  .croise th.sep, .croise td.sep { border-left: 2px solid var(--border); }
  .croise th.grp { text-align: center; border-bottom: 1px solid var(--border); }
  .croise td.nom-modele { font-size: 11px; white-space: nowrap; }
  .croise th.tri { user-select: none; }
  .croise th.tri:hover { color: var(--accent); }
  /* la note est le seul repere visuel du tableau : elle doit sauter aux yeux */
  .croise td.bon    { color: var(--ok);      font-weight: 700; }
  .croise td.moyen  { color: var(--warn, #d68910); font-weight: 600; }
  .croise td.mauvais{ color: var(--danger, #c0392b); font-weight: 700; }
</style>
</head>
<body>

<!-- ============ barre haute ============ -->
<div class="haut">
  <div class="marque">Traduction PDF<small id="projet-titre"></small></div>
  <div class="etapes" id="etapes"></div>
  <span class="pilule" id="pilule-proxy" title="etat du proxy Hermes">◌</span>
</div>

<!-- ============ corps ============ -->
<div class="corps">

  <!-- projets : A GAUCHE, repliable -->
  <aside class="projets" id="panneau-projets">
    <div class="ptete">
      <button class="bascule" id="bascule" title="Replier / deplier">‹</button>
      <span class="ptete-texte">Projets</span>
    </div>
    <div class="pliste" id="pliste"></div>
    <div class="pied" style="flex-direction:column">
      <button class="btn plein" id="btn-banc"
        title="Mesurer les modeles sur nos 4 scenarios de production (global, hors projet)">Banc des modeles</button>
      <button class="btn plein acc" id="btn-creer">+ Creer un projet</button>
    </div>
  </aside>

  <div class="centre">
    <div class="onglets" id="onglets">
      <button class="onglet on" data-vue="config">Config</button>
      <button class="onglet" data-vue="options">Options</button>
      <button class="onglet" data-vue="contexte">Contexte</button>
      <button class="onglet" data-vue="polices">Polices</button>
      <button class="onglet" data-vue="glossaire">Glossaire</button>
      <button class="onglet" data-vue="pdfs">PDFs</button>
      <button class="onglet" data-vue="log">Log</button>
    </div>
    <div class="vue" id="vue"></div>
  </div>

</div>

<div class="notif" id="notif"></div>

<!-- modal creation -->
<div class="modal-fond cache" id="modal-confirm">
  <div class="modal" style="width:470px">
    <h3 id="confirm-titre">Confirmer</h3>
    <div id="confirm-contenu" class="faible" style="max-height:50vh;overflow:auto"></div>
    <div class="rangee">
      <button class="btn" id="confirm-non">Annuler</button>
      <button class="btn acc" id="confirm-oui">Lancer</button>
    </div>
  </div>
</div>

<div class="modal-fond cache" id="modal">
  <div class="modal">
    <h3>Nouveau projet</h3>
    <input type="text" id="nom-projet" placeholder="Nom du projet" style="width:100%">
    <div class="rangee">
      <button class="btn" id="modal-annuler">Annuler</button>
      <button class="btn acc" id="modal-ok">Creer</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------- etat

const S = {
  projets: [], actif: null, projet: null, options: null,
  vue: "config", etapes: {}, poll: null, replie: false,
  suivant: null,          // recapitulatif de l'etape suivante
  tri: "ordre", filtrePdf: "", _logEtape: "contexte", _ctxCle: null,
  // tri par colonne : sens 1 = croissant, -1 = decroissant, 0 = inactif
  tris: { glossaire: {col: null, sens: 0}, polices: {col: null, sens: 0} },
  bench: null, benchLog: null,
  modeles: [], modelesErreur: "",
};

const ICONES = { pret: "▶", en_cours: "◐", termine: "✓", erreur: "✕", bloque: "⊘", pause: "⏸" };
const ORDRE = ["contexte", "polices", "glossaire", "traduire"];
const LIB = { contexte: "Contexte", polices: "Polices", glossaire: "Glossaire",
              traduire: "Traduire", tout: "Tout" };

// ---------------------------------------------------------------- utils

const $ = (s) => document.querySelector(s);

function notif(message, erreur = false) {
  const n = $("#notif");
  n.textContent = message;
  n.className = "notif on" + (erreur ? " erreur" : "");
  clearTimeout(n._t);
  n._t = setTimeout(() => (n.className = "notif"), 2600);
}

async function api(chemin, options = {}) {
  const r = await fetch("/api" + chemin, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (e) { /* ignore */ }
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}

function echapper(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function taille(o) {
  if (o < 1024) return o + " o";
  if (o < 1048576) return (o / 1024).toFixed(0) + " Ko";
  return (o / 1048576).toFixed(1) + " Mo";
}

// ---------------------------------------------------------------- tri

// Cycle d'un clic sur un en-tete : croissant -> decroissant -> inactif.
function cyclerTri(table, col) {
  const t = S.tris[table];
  if (t.col !== col) { t.col = col; t.sens = 1; }
  else if (t.sens === 1) t.sens = -1;
  else { t.col = null; t.sens = 0; }
}

function fleche(table, col) {
  const t = S.tris[table];
  if (t.col !== col || !t.sens) return '<span class="fl">\u25b4\u25be</span>';
  return `<span class="fl">${t.sens === 1 ? "\u25b4" : "\u25be"}</span>`;
}

function entete(table, col, libelle, extra = "") {
  const t = S.tris[table];
  const actif = t.col === col && t.sens ? "actif" : "";
  return `<th class="tri ${actif}" data-tri="${table}" data-col="${col}" ${extra}>`
    + `${libelle}${fleche(table, col)}</th>`;
}

// Branche les clics des en-tetes d'un tableau.
function brancherTris(racine, table, redessiner) {
  racine.querySelectorAll(`th.tri[data-tri="${table}"]`).forEach((th) =>
    th.addEventListener("click", () => {
      cyclerTri(table, th.dataset.col);
      redessiner();
    }));
}

// Applique le tri courant. numerique : colonnes a comparer comme des nombres.
function appliquerTri(liste, table, numerique = []) {
  const t = S.tris[table];
  if (!t.col || !t.sens) return liste;
  const num = numerique.includes(t.col);
  const cle = (o) => {
    const v = o[t.col];
    return num ? (Number(v) || 0) : String(v ?? "").toLowerCase();
  };
  return [...liste].sort((a, b) => {
    const x = cle(a), y = cle(b);
    const c = num ? x - y : x.localeCompare(y, "fr");
    return c * t.sens;
  });
}

// Le CSV stocke le nom de fichier ('metrofutura.ttf'), le catalogue propose
// le nom sans extension ('metrofutura'). On compare donc sans extension.
function memePolice(a, b) {
  const n = (s) => String(s ?? "").toLowerCase().replace(/\.(ttf|otf|ttc)$/, "");
  return !!a && !!b && n(a) === n(b);
}

// ---------------------------------------------------------------- projets

async function chargerProjets() {
  const d = await api("/projets");
  S.projets = d.projets || [];

  // premier projet par defaut, ou celui deja actif s'il existe encore
  if (!S.actif || !S.projets.some((p) => p.nom === S.actif)) {
    S.actif = S.projets.length ? S.projets[0].nom : null;
  }
  dessinerProjets();
  if (S.actif) await chargerProjet(S.actif);
  else { S.projet = null; S.etapes = {}; S.options = null; dessinerEtapes(); dessinerVue(); }
}

function dessinerProjets() {
  const l = $("#pliste");
  if (!S.projets.length) {
    l.innerHTML = '<p class="vide" style="padding:8px">Aucun projet</p>';
    return;
  }
  l.innerHTML = S.projets.map((p) => `
    <button class="pitem ${p.nom === S.actif ? "on" : ""}" data-projet="${echapper(p.nom)}">
      <span class="pt"></span>
      <span class="pn">${echapper(p.nom)}</span>
      <span class="pc">${p.pdfs}</span>
    </button>`).join("");
  l.querySelectorAll("[data-projet]").forEach((b) =>
    b.addEventListener("click", () => chargerProjet(b.dataset.projet)));
}

async function chargerBanc() {
  // le catalogue alimente aussi les dropdowns d'Options : S.modeles reste
  // une liste d'ids, comme avant
  try {
    const cat = await api("/banc/catalogue");
    S.bancCatalogue = cat;
    S.bancScenarios = cat.scenarios || [];
    S.modeles = (cat.modeles || []).map((m) => m.id);
    S.modelesErreur = cat.erreur || "";
  } catch (e) { S.modeles = []; S.modelesErreur = "serveur injoignable"; }
  try { S.banc = await api("/banc/resultats"); }
  catch (e) { S.banc = null; }
}

async function chargerProjet(nom) {
  S.actif = nom;
  if (S.vue === "bench") S.vue = "config";
  const [p, o, s] = await Promise.all([
    api("/projets/" + encodeURIComponent(nom)),
    api("/projets/" + encodeURIComponent(nom) + "/options").catch(() => null),
    api("/projets/" + encodeURIComponent(nom) + "/etape/suivante").catch(() => null),
  ]);
  S.projet = p; S.options = o; S.etapes = p.etapes || {};
  S.suivant = s || { suivante: null, libelle: "", resume: {} };
  $("#projet-titre").textContent = nom ? "· " + nom : "";
  dessinerProjets(); dessinerEtapes(); dessinerVue(); demarrerPoll();
}

// ---------------------------------------------------------------- etapes

function dessinerEtapes() {
  const zone = $("#etapes");
  if (!S.actif) {
    zone.innerHTML = '<span class="faible" style="padding:6px 2px">Selectionne ou cree un projet</span>';
    return;
  }
  const bouton = (cle) => {
    const v = S.etapes[cle] || { etat: "pret", fait: 0, total: 0 };
    const pct = v.total ? Math.round((v.fait / v.total) * 100) : 0;
    const det = v.etat === "en_cours" ? (v.total ? `${v.fait}/${v.total}` : "demarrage…")
      : v.etat === "termine" ? "termine"
      : v.etat === "erreur" ? "erreur"
      : v.etat === "bloque" ? (v.raison || "bloque") : "";
    const off = v.etat === "en_cours" || v.etat === "bloque" ? "disabled" : "";
    return `<button class="etape ${v.etat} ${cle === "tout" ? "tout" : ""}" data-etape="${cle}"
              title="${echapper(v.raison || v.erreur || LIB[cle])}">
      <span class="barre" style="width:${pct}%"></span>
      <span class="ic">${ICONES[v.etat] || "▶"}</span>
      <span class="nom">${LIB[cle]}</span>
      <span class="det">${echapper(det)}</span></button>`;
  };
  // Pas de bouton "Tout" : le workflow demande une pause entre chaque etape,
  // pour valider a la main. C'est "etape suivante" qui avance.
  zone.innerHTML = ORDRE.map(bouton).join("") + boutonSuivant();

  const bs = zone.querySelector("[data-suivant]");
  if (bs) bs.addEventListener("click", () => lancerEtapeSuivante());

  // Pause : visible seulement si une etape tourne. Relancer suffit ensuite,
  // le cache BabelDOC evite de retraduire ce qui est deja fait.
  if (ORDRE.some((e) => S.etapes[e]?.etat === "en_cours")) {
    const bp = document.createElement("button");
    bp.className = "etape pause";
    bp.dataset.pause = "";
    bp.title = "Arreter la tache en cours — relance pour reprendre";
    bp.innerHTML = '<span class="ic">⏸</span><span class="nom">Pause</span>';
    bp.addEventListener("click", async () => {
      try {
        await api(`/projets/${encodeURIComponent(S.actif)}/etape/pause`,
          { method: "POST", body: "{}" });
        notif("Arrete — relance pour reprendre");
        chargerProjet(S.actif);
      } catch (e) { notif(e.message, true); }
    });
    zone.appendChild(bp);
  }

  zone.querySelectorAll("[data-etape]").forEach((b) =>
    b.addEventListener("click", () => lancerEtape(b.dataset.etape)));
}

// Le bouton "etape suivante" : dit ce qu'il va lancer, puis demande confirmation.
function boutonSuivant() {
  const v = S.suivant || {};
  const nom = v.libelle || "";
  if (!v.suivante) {
    // aucune étape proposable : on explique pourquoi, plutôt qu'un bouton mort
    return `<button class="etape tout" data-suivant disabled
      title="${echapper(v.raison || "Toutes les etapes sont faites")}">
      <span class="ic">⊘</span>
      <span class="nom">${echapper(v.etat_global === "vide" ? "Aucun PDF" : "Terminé")}</span>
      <span class="det">${echapper(v.raison ? "" : "rien à lancer")}</span></button>`;
  }
  return `<button class="etape tout" data-suivant
    title="Lancer l'etape : ${echapper(nom)}">
    <span class="ic">▶</span>
    <span class="nom">${echapper(nom)}</span>
    <span class="det">suivante</span></button>`;
}

async function lancerEtape(etape) {
  try {
    await api(`/projets/${encodeURIComponent(S.actif)}/etape/${etape}`, { method: "POST" });
    notif(LIB[etape] + " lance");
    if (etape === "tout") ORDRE.forEach((e) => (S.etapes[e] = { etat: "en_cours", fait: 0, total: 0 }));
    else S.etapes[etape] = { etat: "en_cours", fait: 0, total: 0 };
    dessinerEtapes();
    demarrerPoll();
  } catch (e) {
    notif(e.message, true);
  }
}

// Avant de lancer l'etape suivante : rappeler ou en est le projet, et ce qui
// manque. Le workflow repose sur une pause de validation entre chaque etape,
// donc on ne lance jamais sans avoir montre l'etat.
// Confirmation via la modale. Resout true si l'utilisateur accepte.
// Remplace window.confirm, qui bloque le navigateur entier.
function confirmer(titre, contenuHTML, libelleOk) {
  return new Promise((resolve) => {
    const fond = $("#modal-confirm");
    $("#confirm-titre").textContent = titre;
    $("#confirm-contenu").innerHTML = contenuHTML;
    $("#confirm-oui").textContent = libelleOk || "Lancer";

    const fini = (v) => {
      fond.classList.add("cache");
      $("#confirm-oui").removeEventListener("click", oui);
      $("#confirm-non").removeEventListener("click", non);
      document.removeEventListener("keydown", surTouche);
      resolve(v);
    };
    const oui = () => fini(true);
    const non = () => fini(false);
    const surTouche = (e) => { if (e.key === "Escape") fini(false); };

    $("#confirm-oui").addEventListener("click", oui);
    $("#confirm-non").addEventListener("click", non);
    document.addEventListener("keydown", surTouche);
    fond.classList.remove("cache");
  });
}

async function lancerEtapeSuivante() {
  if (!S.actif) return;
  let s = S.suivant;
  try { s = await api(`/projets/${encodeURIComponent(S.actif)}/etape/suivante`); S.suivant = s; }
  catch (e) { return notif(e.message, true); }

  if (!s.suivante) return notif("Toutes les etapes sont faites");

  const r = s.resume || {};
  const a = [];

  // ce qui est fait
  if (r.contextes) a.push(`✓ contexte : ${r.contextes} document(s)`);
  else a.push("• contexte : a faire");
  if (r.polices) a.push(`✓ polices : ${r.polices_choisies}/${r.polices} choisie(s)`);
  else a.push("• polices : a faire");
  if (r.termes) {
    a.push(`✓ glossaire : ${r.termes} terme(s)`
      + (r.termes_pieges ? ` — dont ${r.termes_pieges} source = cible` : ""));
  } else a.push("• glossaire : a faire");

  // ce qui va etre traite
  const sel = r.pdfs_selectionnes || 0;
  const nb = sel || r.pdfs_source || 0;
  let suite = `Va lancer : ${s.libelle} sur ${nb} PDF(s)`;
  if (sel && sel < (r.pdfs_source || 0)) {
    suite += ` (selection : ${sel} sur ${r.pdfs_source})`;
  }

  // ce qui manque
  const manques = [];
  if (!r.pdfs_source) manques.push("aucun PDF dans source/");
  if (s.suivante === "traduire" && !r.termes) {
    manques.push("glossaire vide : la traduction sera moins coherente");
  }
  if (s.suivante === "traduire" && r.polices && !r.polices_choisies) {
    manques.push("aucune police de remplacement choisie");
  }
  if (r.termes_pieges) {
    manques.push(`${r.termes_pieges} terme(s) source = cible : verifie que c'est voulu`);
  }
  if (s.suivante === "glossaire" && r.polices_choisies < r.polices) {
    manques.push(`${r.polices - r.polices_choisies} police(s) sans remplacement`);
  }

  const html =
    `<p style="margin:0 0 10px">${echapper(suite)}</p>`
    + `<div>${a.map((l) =>
        `<div class="faible" style="padding:2px 0">${echapper(l)}</div>`).join("")}</div>`
    + (manques.length
        ? `<h2 class="titre" style="margin:14px 0 6px">A verifier</h2>`
          + manques.map((m) =>
              `<div style="color:var(--attention);padding:2px 0">${echapper(m)}</div>`).join("")
        : "");

  const ok = await confirmer(`Lancer : ${s.libelle}`, html, `Lancer ${s.libelle}`);
  if (!ok) return notif("Annule");
  await lancerEtape(s.suivante);
}

function demarrerPoll() {
  clearInterval(S.poll);
  S.poll = setInterval(async () => {
    if (!S.actif) return;
    try {
      const d = await api("/projets/" + encodeURIComponent(S.actif));
      const avant = JSON.stringify(S.etapes);
      S.etapes = d.etapes || {};
      S.projet = d;
      if (JSON.stringify(S.etapes) !== avant) {
        dessinerEtapes();
        if (["polices", "pdfs", "contexte"].includes(S.vue)) dessinerVue();
      }
      if (S.vue === "log") rafraichirLog(S._logEtape);
    } catch (e) { /* le serveur a peut-etre redemarre */ }
  }, 1500);
}

// Deux noms de modeles designent-ils la meme chose ?
function memeModele(a, b) {
  return String(a ?? "").toLowerCase() === String(b ?? "").toLowerCase();
}

// Modeles en echec au dernier test : {modele: raison}.
// On lit la MOINDRE config : un modele qui a reussi une fois n'est pas mort.
function echecsModeles() {
  const out = new Map();
  for (const m of S.banc?.resultats?.modeles || []) {
    const ok = Number((m.reussis || "0/0").split("/")[0]);
    if (ok > 0) {
      out.delete(m.modele);            // il a reussi quelque part
      continue;
    }
    if (out.has(m.modele)) continue;
    // on retient la raison du premier scenario qui a echoue
    for (const s of (S.bancScenarios || [])) {
      const r = m[s];
      if (r && !r.ok && r.erreur) { out.set(m.modele, raison(r.erreur)); break; }
    }
    if (!out.has(m.modele)) out.set(m.modele, "echec");
  }
  return out;
}

// "429" / "404" / "400" pour l'affichage court dans les listes deroulantes
function raison(texte) {
  const m = (texte || "").match(/HTTP (\d{3})/);
  if (m) return m[1];
  if (/429|quota|rate limit/i.test(texte)) return "429";
  if (/Timeout|timed out/i.test(texte)) return "timeout";
  if (/Invalid option|400/i.test(texte)) return "400";
  return "echec";
}

// Un <select> de 425 modeles est inutilisable : on prend un champ texte
// avec suggestions, et on affiche le modele choisi.
function champModele(cle, libelle, aide = "") {
  const o = S.options || {};
  const courant = o[cle] ?? "";
  const perf = perfModeles();

  const suggestion = (q) => {
    const t = q.trim().toLowerCase();
    if (!t) return S.modeles.slice(0, 20);
    return S.modeles.filter((m) => m.toLowerCase().includes(t)).slice(0, 20);
  };
  // perfModeles renvoie des VALEURS, pas des listes : p.lat est un nombre.
  // L'ancien code faisait p.lat.reduce(...) — une exception qui vidait
  // silencieusement tout l'onglet Options.
  const detail = (m) => {
    const p = perf.get(m);
    if (!p) return "";
    const lat = Number(p.lat).toFixed(1);
    const tok = p.tok ? " · " + Math.round(Number(p.tok)) + " tok" : "";
    const echec = echecsModeles().get(m);
    if (echec) return `\u2715 ${echec}`;
    return `${lat}s${tok} · score ${p.exploitables || "—"}`;
  };

  const d = S.modeles.find((m) => m === courant);
  return `<label class="champ" data-champ="${echapper(cle)}">
    <span>${libelle}${aide ? " — " + aide : ""}</span>
    <input type="text" data-opt="${echapper(cle)}" value="${echapper(courant)}"
      list="liste-${echapper(cle)}" placeholder="nom exact du modèle"
      autocomplete="off">
    <datalist id="liste-${echapper(cle)}">
      ${suggestion(courant).map((m) =>
        `<option value="${echapper(m)}">${echapper(detail(m))}</option>`).join("")}
    </datalist>
    <span class="faible" data-info="${echapper(cle)}">
      ${d ? (detail(d) || "aucune mesure") : "modèle hors liste du proxy"}
    </span>
  </label>`;
}

// --- options ---
// Liste deroulante des modeles, avec les chiffres du dernier bench en aide.
// Les mesures du dernier bench, par modele : {modele: {lat: [...], tok: [...]}}
function perfModeles() {
  const out = new Map();
  for (const m of S.banc?.resultats?.modeles || []) {
    if (!m.lat_moy) continue;
    out.set(m.modele, { lat: m.lat_moy, tok: m.tok_sortie_moy || null,
                        exploitables: m.exploitables, tronques: m.tronces });
  }
  return out;
}

    </div>
    <div class="bloc">
      <h2 class="titre">Comportement des etapes</h2>
      ${coche("no_download", "Ne pas chercher les polices sur le web", "--no-download")}
      ${coche("ignorer_contexte", "Recalculer le contexte", "efface les .json existants")}
      ${coche("glossaire_manuel", "Glossaire manuel seulement",
              "le glossaire auto degrade la traduction")}
    </div>
    <div class="rangee">
      <button class="btn acc" id="sv-options">Enregistrer les options</button>

  // au fur et a mesure de la frappe : on rafraichit les suggestions et l'info
  v.querySelectorAll("[data-champ]").forEach((champ) => {

  const nom = encodeURIComponent(S.actif);
  const [lignes, det] = await Promise.all([
    api(`/projets/${nom}/polices`).catch(() => []),
    api(`/projets/${nom}`),
  ]);
  const pol = det.polices_installees || {};
  const duProjet = pol.projet || [];
  const globales = pol.global || [];
  const babeldoc = pol.babeldoc || [];
  const installees = new Set(duProjet.map((x) => x.nom));

  const t = S.tris.polices;
  if (t.col && t.sens) {
    const num = ["spans", "pages", "nb_pdfs"].includes(t.col);
    lignes.sort((a, b) => {
      const x = num ? (Number(a[t.col]) || 0) : String(a[t.col] ?? "").toLowerCase();
      const y = num ? (Number(b[t.col]) || 0) : String(b[t.col] ?? "").toLowerCase();
      return (num ? x - y : x.localeCompare(y, "fr")) * t.sens;
    });
  }

  // La liste deroulante : les trois provenances, groupees par <optgroup>.
  const groupes = [
    ["Projet", duProjet],
    ["Global (partage)", globales],
    ["BabelDOC (par defaut)", babeldoc],
  ];
  const options = (choisi) => {
    let out = '<option value="">— police par defaut —</option>';
    for (const [titre, liste] of groupes) {
      if (!liste.length) continue;
      out += `<optgroup label="${echapper(titre)} (${liste.length})">`;
      for (const f of liste) {
        const sel = memePolice(f.nom, choisi) ? "selected" : "";
        out += `<option value="${echapper(f.nom)}" ${sel}>${echapper(f.nom)}</option>`;
      }
      out += `</optgroup>`;
    }
    return out;
  };

  let html = `<div class="bloc">
    <h2 class="titre">Detectees dans les PDFs — ${lignes.length}</h2>`;
  if (!lignes.length) {
    html += `<p class="vide">Lance l'etape Polices pour detecter.</p>`;
  } else {
    html += `<p class="faible" style="margin:0 0 7px">
      ${duProjet.length} dans le projet · ${globales.length} globales ·
      ${babeldoc.length} BabelDOC. Le bouton <b>installer</b> copie la police
      dans le projet et remplit la ligne.</p>
      <div class="scroll-tab"><table><tr>
        ${entete("polices", "police_origine", "Police d'origine")}
        ${entete("polices", "remplacement", "Remplacee par")}
        ${entete("polices", "origine", "Origine")}
        ${entete("polices", "propose", "Propose")}
        ${entete("polices", "famille", "Famille")}
        ${entete("polices", "spans", "Mots")}
        ${entete("polices", "pages", "Pages")}
        ${entete("polices", "nb_pdfs", "PDFs")}
        ${entete("polices", "pdfs", "Details")}
      </tr>`;
    for (const l of lignes) {
      const dansProjet = [...installees].some((i) => memePolice(i, l.remplacement));
      html += `<tr>
        <td>${echapper(l.police_origine)}</td>
        <td class="rangee" style="gap:4px">
          <select data-pol="${echapper(l.police_origine)}" style="max-width:200px">
            ${options(l.remplacement)}</select>
          <button class="btn mini" data-inst="${echapper(l.police_origine)}"
            title="Copier la police choisie dans le projet et remplir la ligne"
            ${dansProjet ? "disabled" : ""}>${dansProjet ? "✓" : "installer"}</button>
        </td>
        <td><span class="tag ${echapper(l.origine || "defaut")}">${echapper(l.origine || "defaut")}</span></td>
        <td class="faible">${echapper(l.propose || "—")}</td>
        <td class="faible">${echapper(l.famille || "")}</td>
        <td>${echapper(l.spans || "—")}</td>
        <td>${echapper(l.pages || "—")}</td>
        <td>${echapper(l.nb_pdfs || "—")}</td>
        <td class="faible" style="font-size:11px">${echapper(l.pdfs || "")}</td>
      </tr>`;
    }
    html += `</table></div><div style="margin-top:8px"><button class="btn acc" id="sv-polices">
      Enregistrer les choix</button></div>`;
  }
  html += `</div>`;

  html += `<div class="bloc">
    <h2 class="titre">Polices disponibles — ${duProjet.length + globales.length + babeldoc.length}</h2>
    <table>
      <tr><td style="width:210px" class="faible">Projet (analyse/polices/)</td>
        <td>${duProjet.length ? duProjet.map((f) =>
          `<span class="tag installe">${echapper(f.nom)}</span>`).join(" ")
          : '<span class="vide">aucune</span>'}</td></tr>
      <tr><td class="faible">Global (partage)</td>
        <td>${globales.length ? globales.map((f) =>
          `<span class="tag">${echapper(f.nom)}</span>`).join(" ")
          : '<span class="vide">aucune</span>'}</td></tr>
      <tr><td class="faible">BabelDOC (par defaut)</td>
        <td>${babeldoc.map((f) =>
          `<span class="tag defaut">${echapper(f.nom)}</span>`).join(" ")}</td></tr>
    </table>
    <p class="faible" style="margin-top:8px">
      Depose tes .ttf dans <code>Global/polices/</code> pour les partager
      entre projets, ou dans <code>analyse/polices/</code> pour ce projet seul.</p>
  </div>`;

  v.innerHTML = html;
  brancherTris(v, "polices", () => vuePolices(v));

  // installer : copie le fichier + remplit la ligne du CSV
  v.querySelectorAll("[data-inst]").forEach((b) =>
    b.addEventListener("click", async () => {
      const police = b.dataset.inst;
      const sel = v.querySelector(`select[data-pol="${CSS.escape(police)}"]`);
      const fichier = sel?.value;
      if (!fichier) return notif("Choisis d'abord une police", true);
      try {
        const r = await api(`/projets/${nom}/police/installer`, {
          method: "POST",
          body: JSON.stringify({ fichier, police_origine: police }) });
        notif(`${r.installe} installee (depuis ${r.depuis})`);
        vuePolices(v);
      } catch (e) { notif(e.message, true); }
    }));

  const sv = v.querySelector("#sv-polices");
  if (sv) sv.addEventListener("click", async () => {
    const maj = {};
    v.querySelectorAll("[data-pol]").forEach((s) => (maj[s.dataset.pol] = s.value));
    const polices = lignes.map((l) => {
      const remplacement = maj[l.police_origine] ?? "";
      let origine = l.origine;
      if (remplacement && remplacement !== (l.propose || "")) origine = "manuel";
      else if (!remplacement) origine = "defaut";
      return {
        police_origine: l.police_origine, remplacement, origine,
        propose: l.propose, raison: l.raison, famille: l.famille,
      };
    });
    try {
      const r = await api(`/projets/${nom}/polices`, {
        method: "PUT", body: JSON.stringify({ polices }) });
      notif(`${r.enregistres} police(s) enregistrée(s)`);
      vuePolices(v);
    } catch (e) { notif(e.message, true); }
  });
}

// --- glossaire ---
async function vueGlossaire(v) {
  const nom = encodeURIComponent(S.actif);
  let tous;
  try {
    tous = await api(`/projets/${nom}/glossaire`);
  } catch (e) { v.innerHTML = `<p class="vide">${echapper(e.message)}</p>`; return; }

  // filtre orphelines : un terme n'est orphelin que si TOUS ses PDF ont disparu
  let lignes = S.filtreOrphelins
    ? tous.filter((t) => t.orphelin)
    : tous.filter((t) => !t.orphelin || !S.cacheMasque);

  // tri : le clic d'en-tete prime sur la liste deroulante
  const t = S.tris.glossaire;
  if (t.col && t.sens) {
    const num = ["occurrences", "nb_pages"].includes(t.col);
    lignes = [...lignes].sort((a, b) => {
      const x = num ? (Number(a[t.col]) || 0) : String(a[t.col] ?? "").toLowerCase();
      const y = num ? (Number(b[t.col]) || 0) : String(b[t.col] ?? "").toLowerCase();
      const c = num ? x - y : x.localeCompare(y, "fr");
      return c * t.sens;
    });
  } else if (S.tri !== "ordre") {
    const cmp = {
      alpha: (a, b) => a.source.localeCompare(b.source, "fr"),
      pdf: (a, b) => (a.sources[0]?.pdf || "zz").localeCompare(b.sources[0]?.pdf || "zz")
                     || a.source.localeCompare(b.source, "fr"),
      pages: (a, b) => (b.nb_pages || 0) - (a.nb_pages || 0),
    }[S.tri];
    if (cmp) lignes = [...lignes].sort(cmp);
  }

  const pieges = lignes.filter((l) => l.source && l.source === l.target);
  const nOrphelins = tous.filter((x) => x.orphelin).length;
  const affiche = lignes.slice(0, 400);
  const groupe = S.tri === "pdf" && !(t.col && t.sens);

  let html = `<div class="bloc">
    <h2 class="titre">Glossaire — ${lignes.length} termes${S.filtreOrphelins ? " orphelins" : ""}</h2>
    ${pieges.length ? `<p style="color:var(--attention);margin:0 0 8px">
      ⚠ ${pieges.length} terme(s) où source = cible : le LLM sera forcé de ne pas les traduire.</p>` : ""}
    ${nOrphelins ? `<p style="color:var(--attention);margin:0 0 8px">
      ${nOrphelins} terme(s) orphelin(s) : aucun de leurs PDF source n'existe encore.
      <button class="btn mini danger" id="purger-orph">Tout effacer</button></p>` : ""}`;

  if (!tous.length) {
    html += `<p class="vide">Pas encore de glossaire. Lance l'étape Glossaire.</p></div>`;
    v.innerHTML = html;
    return;
  }

  const pdfs = [...new Set(tous.flatMap((x) => x.sources.map((s) => s.pdf)))].sort();

  html += `<div class="rangee" style="margin-bottom:9px">
      <label class="rangee"><span class="faible">Trier</span>
        <select id="tri">
          <option value="ordre" ${S.tri === "ordre" ? "selected" : ""}>Ordre trouvé</option>
          <option value="alpha" ${S.tri === "alpha" ? "selected" : ""}>Alphabétique</option>
          <option value="pdf" ${S.tri === "pdf" ? "selected" : ""}>Par PDF</option>
          <option value="pages" ${S.tri === "pages" ? "selected" : ""}>Par nombre de pages</option>
        </select></label>
      <label class="rangee"><span class="faible">PDF</span>
        <select id="filtre">
          <option value="">tous</option>
          ${pdfs.map((x) => `<option value="${echapper(x)}" ${x === S.filtrePdf ? "selected" : ""}>${echapper(x)}</option>`).join("")}
        </select></label>
      <label class="case" style="margin:0">
        <input type="checkbox" id="orph-seulement" ${S.filtreOrphelins ? "checked" : ""}>
        <span>orphelines seulement</span></label>
      <button class="btn" id="ajout">+ Ajouter</button>
      <button class="btn acc" id="sv-gloss">Enregistrer</button>
    </div>
    <div class="scroll-tab"><table id="tab-gloss"><tr>
      ${entete("glossaire", "source", "Source", 'style="width:26%"')}
      ${entete("glossaire", "target", "Cible", 'style="width:26%"')}
      <th>Définition</th>
      ${entete("glossaire", "occurrences", "Occ.")}
      <th>Pages</th>
      ${entete("glossaire", "nb_pages", "Nb p.")}
      ${entete("glossaire", "origines", "PDF d'origine")}
      <th></th>
    </tr>`;

  let dernierPdf = null;
  for (const l of affiche) {
    if (groupe) {
      const pdf = l.sources[0]?.pdf || "(sans PDF)";
      if (pdf !== dernierPdf) {
        const n = affiche.filter((x) => (x.sources[0]?.pdf || "(sans PDF)") === pdf).length;
        html += `<tr class="groupe"><td colspan="8">${echapper(pdf)}
          <span class="faible" style="font-weight:400"> — ${n} terme(s)</span></td></tr>`;
        dernierPdf = pdf;
      }
    }
    const srcs = l.sources.map((s) =>
      `${echapper(s.pdf)} p${(s.pages || []).join(",")}` +
      (s.etat === "absent" ? " (absent)" : "")).join(" · ");
    const piege = l.source && l.source === l.target ? ' style="color:var(--attention)"' : "";
    html += `<tr${piege} data-id="${l.id}">
      <td><input type="text" data-src value="${echapper(l.source)}" style="width:100%"></td>
      <td><input type="text" data-tgt value="${echapper(l.target)}" style="width:100%"></td>
      <td class="faible" style="font-size:11px">${echapper(l.definition || "—")}</td>
      <td class="faible">${echapper(l.occurrences || "—")}</td>
      <td><input type="text" data-pages
        value="${echapper(l.sources.flatMap((s) => s.pages).join(","))}"
        style="width:100%" placeholder="6-10"></td>
      <td class="faible">${echapper(l.nb_pages || "—")}</td>
      <td class="faible" style="font-size:11px">${srcs || "—"}</td>
      <td><button class="btn mini" data-suppr>✕</button></td>
    </tr>`;
  }
  html += `</table></div>`;
  if (lignes.length > affiche.length) {
    html += `<p class="faible">${lignes.length - affiche.length} terme(s) non affiché(s).</p>`;
  }
  html += `</div>`;
  v.innerHTML = html;

  brancherTris(v, "glossaire", () => vueGlossaire(v));
  v.querySelector("#tri").addEventListener("change", (e) => {
    S.tri = e.target.value;
    S.tris.glossaire = { col: null, sens: 0 };
    vueGlossaire(v);
  });
  v.querySelector("#filtre").addEventListener("change", (e) => {
    S.filtrePdf = e.target.value;
    vueGlossaire(v);
  });
  v.querySelector("#orph-seulement").addEventListener("change", (e) => {
    S.filtreOrphelins = e.target.checked;
    vueGlossaire(v);
  });
  v.querySelectorAll("[data-suppr]").forEach((b) =>
    b.addEventListener("click", () => b.closest("tr").remove()));

  v.querySelector("#ajout").addEventListener("click", () => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input type="text" data-src style="width:100%"></td>
      <td><input type="text" data-tgt style="width:100%"></td>
      <td class="faible">—</td><td><input type="text" data-pages style="width:100%"></td>
      <td class="faible">—</td><td class="faible">—</td>
      <td><button class="btn mini" data-suppr>✕</button></td>`;
    v.querySelector("#tab-gloss").appendChild(tr);
    tr.querySelector("[data-suppr]").addEventListener("click", () => tr.remove());
    tr.querySelector("[data-src]").focus();
  });

  const purger = v.querySelector("#purger-orph");
  if (purger) purger.addEventListener("click", async () => {
    const ok = await confirmer(
      "Effacer les orphelines",
      `<p style="margin:0 0 8px">${nOrphelins} terme(s) dont aucun PDF source
        n'existe encore seront <b>supprimés définitivement</b>.</p>`,
      "Effacer");
    if (!ok) return;
    try {
      const r = await api(`/projets/${nom}/glossaire/purger-orphelins`,
        { method: "POST", body: "{}" });
      notif(`${r.supprimes} terme(s) effacé(s)`);
      chargerProjet(S.actif);
      vueGlossaire(v);
    } catch (e) { notif(e.message, true); }
  });

  v.querySelector("#sv-gloss").addEventListener("click", async () => {
    const termes = [];
    v.querySelectorAll("#tab-gloss tr").forEach((tr) => {
      if (tr.classList.contains("groupe")) return;
      const s = tr.querySelector("[data-src]"), tg = tr.querySelector("[data-tgt]");
      if (!s || !tg || !s.value.trim()) return;
      termes.push({
        id: tr.dataset.id ? Number(tr.dataset.id) : null,
        source: s.value.trim(), target: tg.value.trim(), tgt_lng: "fr",
      });
    });
    try {
      const r = await api(`/projets/${nom}/glossaire`, {
        method: "PUT", body: JSON.stringify({ termes }) });
      notif(`${r.enregistres} terme(s) enregistré(s) — origine passée à manuel`);
      vueGlossaire(v);
    } catch (e) { notif(e.message, true); }
  });
}

// --- pdfs ---
async function vuePdfs(v) {
  const nom = encodeURIComponent(S.actif);
  const d = await api("/projets/" + nom);
  const o = S.options || {};
  const src_ = d.source || [], trad = d.traduits || [];
  const selAnalyse = new Set(o.pdfs_analyser || []);
  const selTraduire = new Set(o.pdfs_traduire || []);

  let html = `<div class="bloc">
    <h2 class="titre">PDFs — ${src_.length} source, ${trad.length} traduit</h2>
    <div class="rangee" style="margin-bottom:9px">
      <input type="file" id="fichiers" accept="application/pdf" multiple class="cache">
      <button class="btn acc" id="btn-ajout">+ Ajouter des PDFs</button>
      <button class="btn" id="tout-analyse">Tout cocher (analyse)</button>
      <button class="btn" id="rien-analyse">Tout decocher (analyse)</button>
      <button class="btn danger" id="suppr-src">Supprimer les sources</button>
      <button class="btn danger" id="suppr-trad">Supprimer les traductions</button>
    </div>
    <table><tr>
      <th>Document</th><th>Traduction</th>
      <th title="Inclure dans l'analyse de contexte, polices et glossaire">Analyser</th>
      <th title="Traduire dans cette execution">Traduire</th>
      <th></th>
    </tr>`;

  if (!src_.length) html += `<tr><td colspan="5" class="vide">Aucun PDF. Ajoute-en.</td></tr>`;
  for (const s of src_) {
    const base = s.nom.replace(/\.pdf$/i, "");
    const t = trad.find((x) => x.nom.startsWith(base));
    html += `<tr>
      <td>${echapper(s.nom)}<br><span class="faible">${taille(s.taille)}</span></td>
      <td>${t ? echapper(t.nom) + `<br><span class="faible">${taille(t.taille)}</span>`
            : '<span class="vide">pas encore traduit</span>'}</td>
      <td><input type="checkbox" data-sel="analyse" data-nom="${echapper(s.nom)}" ${selAnalyse.has(s.nom) ? "checked" : ""}></td>
      <td><input type="checkbox" data-sel="traduire" data-nom="${echapper(s.nom)}" ${selTraduire.has(s.nom) ? "checked" : ""}></td>
      <td class="rangee">
        <button class="btn mini" data-comp="${echapper(s.nom)}" ${t ? "" : "disabled"}>Comparer</button>
        <button class="btn mini danger" data-del="${echapper(s.nom)}">✕</button>
      </td>
    </tr>`;
  }
  html += `</table>
    <p class="faible" style="margin-top:8px">
      Les cases sont enregistrees avec les <b>Options</b>. Aucune cochee = tout le lot.</p>
  </div>
  <div class="bloc" id="zone-reg"></div>
  <div class="bloc" id="zone-pages"></div>
  <div class="bloc" id="zone-comp"></div>`;
  v.innerHTML = html;

  // --- registre : les PDF connus, presents ET absents
  const reg = await api(`/projets/${nom}/pdfs`).catch(() => ({ pdfs: [], reassociations: {} }));
  if (reg.pdfs.length) {
    const zoneR = v.querySelector("#zone-reg");
    let r = `<div class="rangee" style="margin-bottom:7px">
        <h2 class="titre" style="margin:0">Registre — ${reg.pdfs.length} PDF connu(s)</h2>
      </div>`;

    // renommages proposes : un PDF absent et un nouveau de meme empreinte
    const props = Object.entries(reg.reassociations || {});
    if (props.length) {
      r += `<div class="rangee" style="margin-bottom:9px">
        <span class="faible">Contenu identique, nom différent :</span>` +
        props.map(([nouveau, ancien]) =>
          `<span class="tag manuel">${echapper(nouveau)}</span>
           <button class="btn mini acc" data-reassoc="${echapper(nouveau)}"
             title="Réassocier à ${echapper(ancien)}">→ ${echapper(ancien)}</button>`).join("") +
        `</div>`;
    }

    r += `<table><tr>
      <th>PDF</th><th>Présence</th><th>Analyser</th>
      <th>Renommé depuis</th><th></th></tr>`;
    for (const x of reg.pdfs) {
      const absent = x.etat === "absent";
      r += `<tr${absent ? ' style="opacity:.6"' : ""}>
        <td>${echapper(x.nom)}</td>
        <td>${absent ? '<span class="faible">absent du dossier</span>'
                     : '<span style="color:var(--ok)">présent</span>'}</td>
        <td><label class="case" style="margin:0">
          <input type="checkbox" data-mode="${echapper(x.nom)}"
            ${x.mode === "ignore" ? "" : "checked"}>
          <span class="faible">inclure</span></label></td>
        <td class="faible" style="font-size:11px">${echapper((x.anciens || []).join(", "))}</td>
        <td class="rangee">
          <button class="btn mini" data-rename="${echapper(x.nom)}">renommer</button>
          <button class="btn mini danger" data-purge="${echapper(x.nom)}"
            ${absent ? "" : "disabled"}
            title="Supprimer la fiche et ses données — définitif">purger</button>
        </td></tr>`;
    }
    r += `</table>
      <p class="faible" style="margin-top:7px">
        Un PDF décoché garde ses données, il est juste exclu des prochaines analyses.
        Un PDF supprimé du dossier reste listé ici, avec ce qu'il a produit.</p>`;
    zoneR.innerHTML = r;

    zoneR.querySelectorAll("[data-mode]").forEach((c) =>
      c.addEventListener("change", async () => {
        try {
          await api(`/projets/${nom}/pdf/mode`, { method: "POST", body: JSON.stringify({
            nom: c.dataset.mode, mode: c.checked ? "inclus" : "ignore" }) });
          notif(c.checked ? "Sera analysé" : "Ignoré — données conservées");
        } catch (e) { notif(e.message, true); }
      }));

    zoneR.querySelectorAll("[data-rename]").forEach((b) =>
      b.addEventListener("click", async () => {
        const ancien = b.dataset.rename;
        const nouveau = prompt("Nouveau nom (le contexte et les termes suivent) :", ancien);
        if (!nouveau || nouveau === ancien) return;
        try {
          await api(`/projets/${nom}/pdf/renommer`, { method: "POST",
            body: JSON.stringify({ ancien, nouveau }) });
          notif("Renommé"); chargerProjet(S.actif); vuePdfs(v);
        } catch (e) { notif(e.message, true); }
      }));

    zoneR.querySelectorAll("[data-reassoc]").forEach((b) =>
      b.addEventListener("click", async () => {
        const nouveau = b.dataset.reassoc;
        const ancien = reg.reassociations[nouveau];
        try {
          const ids = await api(`/projets/${nom}/pdfs`);
          const cible = (ids.pdfs || []).find((x) => x.nom === nouveau);
          await api(`/projets/${nom}/pdf/rattacher`, { method: "POST",
            body: JSON.stringify({ nouveau, ancien_id: cible ? cible.id : null }) });
          notif("Réassocié"); chargerProjet(S.actif); vuePdfs(v);
        } catch (e) { notif(e.message, true); }
      }));

    zoneR.querySelectorAll("[data-purge]").forEach((b) =>
      b.addEventListener("click", async () => {
        const nomPdf = b.dataset.purge;

function comparer(nomSource, trad, v) {
  const base = nomSource.replace(/\.pdf$/i, "");
  const t = trad.find((x) => x.nom.startsWith(base));
  if (!t) return;
  const n = encodeURIComponent(S.actif);
  const zone = v.querySelector("#zone-comp");
  zone.innerHTML = `
    <h2 class="titre">Comparaison — ${echapper(nomSource)}</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;height:70vh">
      <div style="display:flex;flex-direction:column;min-width:0">
        <p class="faible" style="margin:0 0 4px">Original</p>
        <iframe src="/api/projets/${n}/pdf/${encodeURIComponent(nomSource)}?type=source"
          style="flex:1;width:100%;border:1px solid var(--bord);border-radius:7px"></iframe></div>
      <div style="display:flex;flex-direction:column;min-width:0">
        <p class="faible" style="margin:0 0 4px">Traduit</p>
        <iframe src="/api/projets/${n}/pdf/${encodeURIComponent(t.nom)}?type=traduit"
          style="flex:1;width:100%;border:1px solid var(--bord);border-radius:7px"></iframe></div>
    </div>`;
  zone.scrollIntoView({ behavior: "smooth" });
}

// --- le tableau croise du Banc : lignes = modeles, colonnes = tout le reste.
// Triable sur n'importe quelle colonne : c'est la seule facon de savoir quel
// modele gagne sur QUEL scenario plutot qu'en moyenne.
let _triBanc = { col: "score", sens: -1 };

const _ETIQ_COURT = { traduction: "Trad", glossaire: "Glos", contexte: "Ctx", polices: "Poli" };

function _valeurTri(modele, col) {
  const E = _ETIQ_COURT;
  if (col === "modele") return modele.modele || "";
  if (col === "score") return modele.score ?? -1;
  if (col === "lat_moy") return modele.lat_moy ?? 99999;
  if (col.startsWith("score_")) return modele[E[col.slice(6)]]?.score ?? -1;
  if (col.startsWith("lat_")) {
    const s = modele[E[col.slice(4)]]?.stats?.lat;
    return s?.[col.slice(4)] ?? 99999;
  }
  if (col.startsWith("ecart_")) return modele[E[col.slice(6)]]?.stats?.lat?.ecart ?? 0;
  if (col.startsWith("termes_")) return modele[E[col.slice(7)]]?.termes ?? 0;
  return 99999;   // colonne non triee : en fin de liste
}

function _trierBanc(modeles, col) {
  if (_triBanc.col !== col) _triBanc.sens = col === "modele" ? 1 : -1;
  else _triBanc.sens *= -1;
  _triBanc.col = col;
  const s = _triBanc.sens;
  return [...modeles].sort((a, b) => {
    const x = _valeurTri(a, col), y = _valeurTri(b, col);
    return (typeof x === "string" || typeof y === "string")
      ? String(x).localeCompare(String(y)) * s : (x - y) * s;
  });
}

function _thTri(col, libelle) {
  const actif = _triBanc.col === col;
  const fleche = actif ? (_triBanc.sens > 0 ? " \u25B2" : " \u25BC") : "";
  return `<th class="tri" data-tri="${echapper(col)}"
    title="Trier par ${echapper(libelle.toLowerCase())}"
    style="cursor:pointer${actif ? ";font-weight:700" : ""}">${echapper(libelle)}${fleche}</th>`;
}

            ca rapporte vraiment. Le gain compare au sequentiel : s'il reste a 1x, on
            se dispute le service au lieu de gagner du temps. Le test s'arrete au
            premier palier qui perd un appel.</p>
          <div class="rangee" style="margin-bottom:8px">
            <label class="rangee"><span class="faible">Paliers</span>
              <input type="text" id="c-niveaux" value="1, 2, 3, 4, 6, 8, 12, 16, 24"
                     style="width:150px"></label>
            <button class="btn acc" id="c-lancer" ${enCours ? "disabled" : ""}>
              ${enCours ? "Mesure en cours…" : "Mesurer la charge"}</button>
          </div>
          ${charge.niveaux && charge.niveaux.length ? `
            <div class="faible" style="margin:0 0 6px">
              ${echapper(charge.modele || "")} — plafond mesure :
              <b style="color:var(--ok)">${charge.tenu || 0} agents</b> sans perte
              ${charge.maj ? ` (${echapper(charge.maj)})` : ""}</div>
            <div class="scroll-tab"><table>
              <tr><th>Agents</th><th>Blocs</th><th>Reussis</th><th>Temps du lot</th>
                  <th>Gain</th><th>Latence min/moy/max</th><th>Tronques</th><th>Termes</th></tr>
              ${charge.niveaux.map((n) => `<tr>
                <td>${n.n_agents}</td>
                <td class="faible">${n.blocs}</td>
                <td class="${n.nb_ok === n.blocs ? "" : "alerte"}">${echapper(n.reussis)}</td>
                <td>${n.total_s}s</td>
                <td${n.gain >= 2 ? ' style="color:var(--ok)"' : ""}>${n.gain ?? "—"}x</td>
                <td class="faible">${n.lat_min ?? "—"} / ${n.lat_moy ?? "—"} / ${n.lat_max ?? "—"}s</td>
                <td class="${n.tronques ? "alerte" : "faible"}">${n.tronques}</td>
                <td class="faible">${n.termes}</td>
              </tr>`).join("")}
            </table></div>
            ${charge.niveaux.some((n) => n.erreurs && n.erreurs.length) ? `
              <div class="log" style="max-height:90px;margin-top:7px">${echapper(
                [...new Set(charge.niveaux.flatMap((n) => n.erreurs || []))].join("\n"))}</div>` : ""}
          ` : `<p class="vide">Pas encore de mesure de charge.</p>`}
        </div>`;

    v.innerHTML = html;

  // le tri : on re-rend avec la nouvelle colonne
  v.querySelectorAll("[data-tri]").forEach((th) =>
    th.addEventListener("click", () => vueBanc(v, th.dataset.tri)));

  // les leviers lus une seule fois pour les deux boutons : si chaque bouton
  // les relisait, ils divergeraient — c'est exactement le bug "auto" d'hier
  const _leviersUI = () => ({
    effort: v.querySelector("#b-effort")?.value || "auto",
    max_tokens: Number(v.querySelector("#b-maxtok")?.value) || 16000,
    temperature: Number(v.querySelector("#b-temp")?.value) || 0,
    top_p: v.querySelector("#b-topp")?.value || null,
    seed: v.querySelector("#b-seed")?.value || null,
    repetition_penalty: v.querySelector("#b-rep")?.value || null,
    stop: v.querySelector("#b-stopseq")?.value || null,
    repetitions: Number(v.querySelector("#b-repet")?.value) || 3,
    include_reasoning: !!v.querySelector("#b-reasoning")?.checked,
    timeout: Number(v.querySelector("#b-timeout")?.value) || 180,
  });

  // ---------- les scenarios choisis ----------
  const _scenariosChoisis = () =>
    [...v.querySelectorAll("[data-sc]:checked")].map((c) => c.dataset.sc);
  v.querySelector("#b-sc-tous")?.addEventListener("click", () =>
    v.querySelectorAll("[data-sc]").forEach((c) => (c.checked = true)));
  v.querySelector("#b-sc-aucun")?.addEventListener("click", () =>
    v.querySelectorAll("[data-sc]").forEach((c) => (c.checked = false)));
  // ---------- fin scenarios ----------
  
  // ---------- le bouton de charge ----------
  const cl = v.querySelector("#c-lancer");
  if (cl) cl.addEventListener("click", async () => {
    const modeles = [...v.querySelectorAll("[data-mod]:checked")].map((c) => c.dataset.mod);
    if (!modeles.length) return notif("Coche au moins un modele", true);
    const niveaux = (v.querySelector("#c-niveaux")?.value || "")
      .split(",").map((x) => Number(x.trim())).filter((x) => x > 0);
    if (!niveaux.length) return notif("Aucun palier valide", true);
    try {
      await api("/banc/charge/lancer", { method: "POST", body: JSON.stringify({
        modeles: [modeles[0]],   // la charge se mesure sur un modele a la fois
        niveaux,
        projet: v.querySelector("#b-source")?.value || "",
        ..._leviersUI(),
      }) });
      notif(`Charge : ${modeles[0]}`);
      vueBanc(v);
    } catch (e) { notif(e.message, true); }
  });

  // ---------- branchements ----------
  const bl = v.querySelector("#b-lancer");
  if (bl) bl.addEventListener("click", async () => {
    const modeles = [...v.querySelectorAll("[data-mod]:checked")].map((c) => c.dataset.mod);
    if (!modeles.length) return notif("Coche au moins un modele", true);
    try {
      await api("/banc/lancer", { method: "POST", body: JSON.stringify({
        modeles,
      ..._leviersUI(),
      }) });
      notif("Banc lance");
      vueBanc(v);
    } catch (e) { notif(e.message, true); }
  });

  const bs = v.querySelector("#b-stop");
  if (bs) bs.addEventListener("click", async () => {
    try { await api("/banc/arreter", { method: "POST", body: "{}" }); notif("Arrete"); vueBanc(v); }
    catch (e) { notif(e.message, true); }
  });
  v.querySelector("#b-rafraichir")?.addEventListener("click", () => vueBanc(v));
  v.querySelector("#b-aucun")?.addEventListener("click", () => {
    v.querySelectorAll("[data-mod]").forEach((c) => (c.checked = false));
    vueBanc(v);
  });
  v.querySelector("#b-gratuits")?.addEventListener("click", () => {
    // la liste ne contient que des gratuits : "tout cocher" les coche tous
    v.querySelectorAll("[data-mod]").forEach((c) => (c.checked = true));
    vueBanc(v);
  });
  v.querySelector("#b-filtre")?.addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    v.querySelectorAll("#b-liste .case").forEach((l) => {
      l.style.display = l.dataset.nom.includes(q) ? "" : "none";
    });
  });
  // cocher un modele met a jour la fiche ET le comparatif immediatement :
  // tu veux voir le resultat en cochant, pas en redemarrant
  v.querySelectorAll("[data-mod]").forEach((c) =>
    c.addEventListener("change", () => vueBanc(v)));
}

// --- log ---
async function vueLog(v) {
  v.innerHTML = `
    <div class="bloc">
      <h2 class="titre">Journal</h2>
      <div style="display:flex;gap:6px;margin-bottom:9px" id="sel-etapes"></div>
      <div class="barre-prog"><i id="barre-log"></i></div>
      <p class="faible" id="det-log" style="margin:0 0 7px"></p>
      <div class="log" id="log-contenu">(aucun log)</div>
    </div>`;
  v.querySelectorAll("[data-le]").forEach((b) =>
    b.addEventListener("click", () => { S._logEtape = b.dataset.le; vueLog(v); }));
  rafraichirLog(S._logEtape);
}

async function rafraichirLog(etape) {
  S._logEtape = etape;
  const c = document.querySelector("#log-contenu");
  if (!c) return;
  try {
    const d = await api(`/projets/${encodeURIComponent(S.actif)}/etape/${etape}/log`);
    c.innerHTML = echapper(d.log || "(aucun log)")
      .replace(/\[PROGRESS\][^\n]*/g, "");
    c.scrollTop = c.scrollHeight;
    const b = document.querySelector("#barre-log");
    if (b) b.style.width = (d.total ? (d.fait / d.total) * 100 : 0) + "%";
    const det = document.querySelector("#det-log");
    if (det) det.textContent = d.total
      ? `${d.fait}/${d.total}  ${d.libelle || ""}  —  ${d.etat}`
      : d.etat;
  } catch (e) { c.textContent = "(erreur de lecture du log)"; }
}

// ---------------------------------------------------------------- csv

function csvChamp(s) {
  s = String(s ?? "");
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function csvLignes(texte) {
  if (!texte || !texte.trim()) return [];
  const lignes = [];
  let champs = [], courant = "", dansGuillemets = false;
  const src = texte.replace(/^\uFEFF/, "");
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (dansGuillemets) {
      if (c === '"' && src[i + 1] === '"') { courant += '"'; i++; }
      else if (c === '"') dansGuillemets = false;
      else courant += c;
    } else if (c === '"') dansGuillemets = true;
    else if (c === ",") { champs.push(courant); courant = ""; }
    else if (c === "\n") { champs.push(courant); lignes.push(champs); champs = []; courant = ""; }
    else if (c !== "\r") courant += c;
  }
  if (courant || champs.length) { champs.push(courant); lignes.push(champs); }
  if (!lignes.length) return [];

  const entete = lignes[0].map((h) => h.trim());
  return lignes.slice(1)
    .filter((l) => l.some((c) => c.trim()))
    .map((l) => {
      const o = {};
      entete.forEach((h, i) => (o[h] = l[i] ?? ""));
      return o;
    });
}

// ---------------------------------------------------------------- init

$("#bascule").addEventListener("click", () => {
  S.replie = !S.replie;
  $("#panneau-projets").classList.toggle("replie", S.replie);
  $("#bascule").textContent = S.replie ? "›" : "‹";
});

$("#onglets").addEventListener("click", (ev) => {
  const b = ev.target.closest(".onglet");
  if (!b) return;
  S.vue = b.dataset.vue;
  document.querySelectorAll(".onglet").forEach((o) => o.classList.toggle("on", o === b));
  dessinerVue();
});

// Le banc et les tests ne sont pas un projet : on decoche les onglets
// pendant qu'on est dedans.
$("#btn-banc").addEventListener("click", () => {
  S.vue = "banc";
  document.querySelectorAll(".onglet").forEach((o) => o.classList.remove("on"));
  $("#projet-titre").textContent = "";
  dessinerVue();
});

$("#btn-creer").addEventListener("click", () => {
  $("#nom-projet").value = "";
  $("#modal").classList.remove("cache");
  $("#nom-projet").focus();
});
$("#modal-annuler").addEventListener("click", () => $("#modal").classList.add("cache"));
$("#modal-ok").addEventListener("click", async () => {
  const nom = $("#nom-projet").value.trim();
  if (!nom) return notif("Nom requis", true);
  try {
    await api("/projets", { method: "POST", body: JSON.stringify({ nom }) });
    $("#modal").classList.add("cache");
    notif("Projet cree");
    await chargerProjets();
    await chargerProjet(nom);
  } catch (e) { notif(e.message, true); }
});
$("#nom-projet").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("#modal-ok").click();
});

async function init() {
  await majProxy();
  setInterval(majProxy, 10000);   // reverifie regulierement
  await Promise.all([
    chargerBanc(),
    chargerBanc(),           // catalogue : alimente aussi les dropdowns
  ]);
  suivreBanc();
  await chargerProjets();
}

// Rafraichit le panneau bench tant qu'un test tourne.
function suivreBanc() {
  clearInterval(S.bancLog);
  S.bancLog = setInterval(async () => {
    if (S.vue !== "banc") return;
    try {
      const d = await api("/banc/resultats");
      const etat = d.etat || {};
      S.banc = d;

      // la barre avance SANS redessiner : un redessin effacerait les cases
      // a cocher au moment ou l'utilisateur en decoche une
      const pct = etat.total ? Math.min(100, ((etat.fait || 0) / etat.total) * 100) : 0;
      const barre = document.querySelector("#vue .barre-prog i");
      if (barre) barre.style.width = pct + "%";
      const detail = document.querySelector("#vue .barre-prog")?.nextElementSibling;
      if (detail) detail.textContent = `${etat.fait || 0}/${etat.total || 0} mesures`;
      const log = document.querySelector("#log-banc");
      if (log && etat.log) { log.textContent = etat.log; log.scrollTop = log.scrollHeight; }

      if (etat.etat !== "en_cours" && S.bancEtat === "en_cours") {
        vueBanc($("#vue"));
        notif(`Banc terminé — ${etat.fait || 0} mesures`);
      }
      S.bancEtat = etat.etat;
    } catch (e) { /* le serveur a peut-etre redemarre */ }
  }, 2000);
}

async function majProxy() {
  const p = $("#pilule-proxy");
  if (!p) return;
  try {
    const e = await api("/etat");
    // icone seule : verte si joignable, rouge sinon. Purement informatif,
    // aucune etape n'est bloquee par l'absence de proxy.
    p.textContent = e.proxy ? "●" : "○";
    p.className = "pilule " + (e.proxy ? "ok" : "ko");
    p.title = e.proxy
      ? "proxy Hermes joignable"
      : "proxy Hermes injoignable — les etapes qui utilisent le LLM echoueront";
  } catch (err) {
    p.textContent = "○";
    p.className = "pilule ko";
    p.title = "serveur injoignable";
  }
}

init();
